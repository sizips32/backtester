[pytest]
pythonpath = .

# 테스트 마커 정의
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    benchmark: Benchmark tests
    slow: Slow tests that may take more than 5 seconds

# 테스트 경로
testpaths = tests

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 출력 설정
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-exclude=venv/*
    --cov-exclude=tests/*
    --cov-exclude=__pycache__/*

# 벤치마크 설정
benchmark_min_rounds = 3
benchmark_max_time = 10
benchmark_min_time = 0.1